name: casaura

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    # This pinned PostGIS tag is amd64-only; Apple Silicon uses Docker's emulation path.
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casaura}
      POSTGRES_USER: ${POSTGRES_USER:-casaura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casaura_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - casaura_postgres:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casaura} -d ${POSTGRES_DB:-casaura}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - casaura_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3.2.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - casaura_opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-casaura}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-casaura_local_only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - casaura_minio:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  casaura_postgres:
  casaura_redis:
  casaura_opensearch:
  casaura_minio:
