name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-scan-sign:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/api/Dockerfile
          - name: api-nginx
            dockerfile: infra/docker/api-nginx/Dockerfile
          - name: web
            dockerfile: infra/docker/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PRODUCTION_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.PRODUCTION_SITE_URL }}
            NEXT_PUBLIC_APP_LOCALE=${{ vars.PRODUCTION_APP_LOCALE }}
            NEXT_PUBLIC_DEFAULT_CURRENCY=${{ vars.PRODUCTION_DEFAULT_CURRENCY }}
            NEXT_PUBLIC_AREA_UNIT=${{ vars.PRODUCTION_AREA_UNIT }}
            NEXT_PUBLIC_COUNTRY_CODE=${{ vars.PRODUCTION_COUNTRY_CODE }}
            NEXT_PUBLIC_LEGAL_DOCUMENT_VERSION=${{ vars.PRODUCTION_LEGAL_DOCUMENT_VERSION }}
            NEXT_PUBLIC_OPERATOR_NAME=${{ vars.PRODUCTION_OPERATOR_NAME }}
            NEXT_PUBLIC_OPERATOR_JURISDICTION=${{ vars.PRODUCTION_OPERATOR_JURISDICTION }}
            NEXT_PUBLIC_OPERATOR_ADDRESS=${{ vars.PRODUCTION_OPERATOR_ADDRESS }}
            NEXT_PUBLIC_SUPPORT_EMAIL=${{ vars.PRODUCTION_SUPPORT_EMAIL }}
            NEXT_PUBLIC_ENABLE_DEMO_DATA=false
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: sigstore/cosign-installer@v4.1.2
      - run: cosign sign --yes ghcr.io/${{ github.repository }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
