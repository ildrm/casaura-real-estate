  /public/sponsored-listings:
    get:
      tags: [Billing, Marketplace]
      operationId: listSponsoredListings
      parameters:
        - { in: query, name: placement, required: true, schema: { type: string, enum: [search, detail, storefront] } }
      responses: { "200": { description: "Clearly labelled, frequency-capped sponsored inventory" } }
components:
  securitySchemes:
    sanctum:
      type: apiKey
      in: cookie
      name: laravel_session
  parameters:
    AgencyId:
      in: header
      name: Agency-ID
      required: true
      schema: { type: string, format: uuid }
    ListingId:
      in: path
      name: listing
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      in: path
      name: media
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 1, maxLength: 160 }
  schemas:
    ProviderConnectionInput:
      type: object
      required: [name, provider, base_url, token_url, client_id, secret_reference, resources, rights]
      properties:
        name: { type: string, maxLength: 160 }
        provider: { type: string, const: reso }
        base_url: { type: string, format: uri }
        token_url: { type: string, format: uri }
        client_id: { type: string, maxLength: 255 }
        secret_reference: { type: string, maxLength: 255 }
        resources: { type: array, minItems: 1, maxItems: 10, items: { type: string } }
        rights:
          type: object
          required: [display, photos, attribution]
          properties:
            display: { type: boolean }
            photos: { type: boolean }
            attribution: { type: string, maxLength: 255 }
        data_dictionary_version: { type: string, default: "2.0" }
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation, consent, consent_version]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 12 }
        password_confirmation: { type: string, format: password }
        consent: { type: boolean, const: true }
        consent_version: { type: string }
    OperationsHealth:
      type: object
      required: [status, service, release]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        service: { type: string, const: casaura-api }
        release: { type: string }
    PublicLeadRequest:
      type: object
      required: [name, email, message, consent]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: [string, "null"], maxLength: 40 }
        message: { type: string, minLength: 10, maxLength: 5000 }
        consent: { type: boolean, const: true }
    Lead:
      type: object
      required: [id, listing_id, status, priority, contact, version, conversation_id]
      properties:
        id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        status: { type: string, enum: [new, contacted, qualified, viewing, won, lost] }
        priority: { type: string, enum: [low, normal, high] }
        contact:
          type: object
          required: [name, email, phone]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: [string, "null"] }
        assigned_member_id: { type: [string, "null"], format: uuid }
        first_responded_at: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
        conversation_id: { type: string, format: uuid }
    LeadResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Lead" }
    ViewingWarning:
      type: object
      required: [code, message, overlap_count]
      properties:
        code: { type: string, const: VIEWING_SCHEDULE_OVERLAP }
        message: { type: string }
        overlap_count: { type: integer, minimum: 1 }
    Viewing:
      type: object
      required: [id, lead_id, listing_id, assigned_member_id, starts_at, ends_at, timezone, status, notes, version, warnings]
      properties:
        id: { type: string, format: uuid }
        lead_id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        assigned_member_id: { type: [string, "null"], format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        timezone: { type: string }
        status: { type: string, enum: [requested, confirmed, completed, cancelled, no_show] }
        notes: { type: [string, "null"] }
        version: { type: integer, minimum: 1 }
        warnings: { type: array, items: { $ref: "#/components/schemas/ViewingWarning" } }
    ViewingResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Viewing" }
    ViewingListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Viewing" } }
    StorefrontResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [agency, opening_hours, team, listings]
          properties:
            agency: { type: object, additionalProperties: true }
            opening_hours: { type: array, items: { type: object, additionalProperties: true } }
            team: { type: array, items: { type: object, additionalProperties: true } }
            listings: { type: array, items: { $ref: "#/components/schemas/PublicListingCard" } }
    AdminHealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, version, checked_at, components, request_id]
          properties:
            status: { type: string, enum: [ok, degraded] }
            version: { type: string }
            checked_at: { type: string, format: date-time }
            components: { type: object, additionalProperties: true }
            request_id: { type: string, format: uuid }
    Agency:
      type: object
      required: [id, name, slug, verification_status, status, timezone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        short_description: { type: [string, "null"] }
        verification_status:
          type: string
          enum: [unverified, pending, verified, rejected, suspended]
        status:
          type: string
          enum: [active, suspended, archived]
        timezone: { type: string }
    Membership:
      type: object
      required: [id, agency, status, roles, permissions]
      properties:
        id: { type: string, format: uuid }
        agency: { $ref: "#/components/schemas/Agency" }
        status: { type: string, enum: [invited, active, suspended] }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
    PrincipalResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, name, email, memberships]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            memberships:
              type: array
              items: { $ref: "#/components/schemas/Membership" }
    PropertyCatalogResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [property_types, amenities, feature_definitions]
          properties:
            property_types:
              type: array
              items:
                type: object
                required: [slug, name, category]
                properties:
                  slug: { type: string }
                  name: { type: string }
                  category: { type: string }
            amenities:
              type: array
              items:
                type: object
                required: [slug, name, group]
                properties:
                  slug: { type: string }
                  name: { type: string }
                  group: { type: string }
            feature_definitions:
              type: array
              items:
                type: object
                required: [slug, name, value_type]
                properties:
                  slug: { type: string }
                  name: { type: string }
                  value_type: { type: string, enum: [boolean, integer, decimal, string, enum] }
                  unit: { type: [string, "null"] }
                  validation: { type: [object, "null"], additionalProperties: true }
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, minimum: 0, maximum: 99999999999999 }
        currency: { type: string, minLength: 3, maxLength: 3 }
    ListingWriteRequest:
      type: object
      properties:
        reference: { type: string, minLength: 2, maxLength: 100, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" }
        intent: { type: string, enum: [sale, rent] }
        property_type_slug: { type: string }
        title: { type: [string, "null"], maxLength: 160 }
        description: { type: [string, "null"], maxLength: 10000 }
        price:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        bedrooms: { type: [integer, "null"], minimum: 0, maximum: 100 }
        bathrooms: { type: [number, "null"], minimum: 0, maximum: 100 }
        interior_area:
          oneOf:
            - type: object
              required: [value, unit]
              properties:
                value: { type: number, exclusiveMinimum: 0, maximum: 10000000 }
                unit: { type: string, enum: [sq_ft, sqm] }
            - type: "null"
        address:
          oneOf:
            - type: object
              properties:
                line_1: { type: [string, "null"], maxLength: 180 }
                line_2: { type: [string, "null"], maxLength: 180 }
                locality: { type: [string, "null"], maxLength: 120 }
                region: { type: [string, "null"], maxLength: 120 }
                postal_code: { type: [string, "null"], maxLength: 32 }
                country_code: { type: [string, "null"], minLength: 2, maxLength: 2 }
                latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
                longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
            - type: "null"
        features:
          type: object
          maxProperties: 100
          additionalProperties:
            oneOf:
              - { type: boolean }
              - { type: integer }
              - { type: number }
              - { type: string }
              - { type: "null" }
        amenity_slugs:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string }
    ListingCreateRequest:
      allOf:
        - $ref: "#/components/schemas/ListingWriteRequest"
        - type: object
          required: [reference, intent, property_type_slug]
    ListingUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ListingWriteRequest"
        - type: object
          required: [version]
          properties:
            version: { type: integer, minimum: 1 }
    QualityCheck:
      type: object
      required: [key, complete, message]
      properties:
        key: { type: string, enum: [basics, location, description, features, media] }
        complete: { type: boolean }
        message: { type: string }
    Quality:
      type: object
      required: [score, ready_for_review, checklist]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        ready_for_review: { type: boolean }
        checklist:
          type: array
          items: { $ref: "#/components/schemas/QualityCheck" }
    MediaDerivative:
      type: object
      required: [kind, mime_type, byte_size, width, height]
      properties:
        kind: { type: string, enum: [thumbnail, display] }
        mime_type: { type: string, const: image/webp }
        byte_size: { type: integer, minimum: 1 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    Media:
      type: object
      required: [id, original_name, mime_type, byte_size, width, height, position, created_at]
      properties:
        id: { type: string, format: uuid }
        original_name: { type: string }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        byte_size: { type: integer, minimum: 1, maximum: 15728640 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        position: { type: integer, minimum: 1, maximum: 30 }
        alt_text: { type: [string, "null"], maxLength: 300 }
        derivatives:
          type: array
          items: { $ref: "#/components/schemas/MediaDerivative" }
        created_at: { type: string, format: date-time }
    Listing:
      type: object
      required: [id, property_id, agency_id, reference, intent, status, version, property, quality, media_count, updated_at]
      properties:
        id: { type: string, format: uuid }
        property_id: { type: string, format: uuid }
        agency_id: { type: string, format: uuid }
        reference: { type: string }
        intent: { type: string, enum: [sale, rent] }
        status: { type: string, enum: [draft, changes_requested, in_review, published, withdrawn] }
        version: { type: integer, minimum: 1 }
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        price:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        property:
          type: object
          required: [property_type, bedrooms, bathrooms, interior_area, address, features, amenities]
          properties:
            property_type:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string }
                name: { type: string }
            bedrooms: { type: [integer, "null"] }
            bathrooms: { type: [number, "null"] }
            interior_area:
              oneOf:
                - type: object
                  required: [sqm, sq_ft]
                  properties:
                    sqm: { type: number }
                    sq_ft: { type: number }
                - type: "null"
            address: { type: [object, "null"], additionalProperties: true }
            features: { type: object, additionalProperties: true }
            amenities: { type: array, items: { type: string } }
        quality: { $ref: "#/components/schemas/Quality" }
        primary_media:
          oneOf:
            - $ref: "#/components/schemas/Media"
            - type: "null"
        media_count: { type: integer, minimum: 0, maximum: 30 }
        submitted_at: { type: [string, "null"], format: date-time }
        published_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }
    ListingResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Listing" }
    ListingPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Listing" }
        meta:
          type: object
          required: [next_cursor]
          properties:
            next_cursor: { type: [string, "null"] }
    MediaResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Media" }
    PublicMedia:
      type: object
      required: [id, alt_text, width, height, thumbnail_url, display_url]
      properties:
        id: { type: string, format: uuid }
        alt_text: { type: [string, "null"] }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        thumbnail_url: { type: [string, "null"] }
        display_url: { type: [string, "null"] }
    PublicLocation:
      type: object
      required: [label, locality, region, country_code, policy, latitude, longitude]
      properties:
        label: { type: string }
        locality: { type: [string, "null"] }
        region: { type: [string, "null"] }
        country_code: { type: [string, "null"] }
        policy: { type: string, enum: [exact, approximate, hidden] }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
    PublicAgency:
      type: object
      required: [id, name, slug, verified]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        verified: { type: boolean }
    PublicListingCard:
      type: object
      required: [id, slug, url, title, intent, price, property_type, bedrooms, bathrooms, interior_area, location, agency, primary_media, media_count, listed_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        url: { type: string }
        title: { type: string }
        intent: { type: string, enum: [sale, rent] }
        price:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        property_type:
          type: object
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
        bedrooms: { type: [integer, "null"] }
        bathrooms: { type: [number, "null"] }
        interior_area:
          oneOf:
            - type: object
              required: [sqm, sq_ft]
              properties:
                sqm: { type: number }
                sq_ft: { type: number }
            - type: "null"
        location: { $ref: "#/components/schemas/PublicLocation" }
        agency: { $ref: "#/components/schemas/PublicAgency" }
        primary_media:
          oneOf:
            - $ref: "#/components/schemas/PublicMedia"
            - type: "null"
        media_count: { type: integer, minimum: 0 }
        listed_at: { type: [string, "null"], format: date-time }
    PublicListingDetail:
      allOf:
        - $ref: "#/components/schemas/PublicListingCard"
        - type: object
          required: [canonical_url, reference, description, features, amenities, media, price_history, engagement, similar_listings]
          properties:
            canonical_url: { type: string }
            reference: { type: string }
            description: { type: [string, "null"] }
            features: { type: object, additionalProperties: true }
            amenities: { type: array, items: { type: string } }
            media: { type: array, items: { $ref: "#/components/schemas/PublicMedia" } }
            price_history:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/Money"
                  - type: object
                    required: [effective_at]
                    properties:
                      effective_at: { type: string, format: date-time }
            agency:
              allOf:
                - $ref: "#/components/schemas/PublicAgency"
                - type: object
                  required: [short_description, contact_handoff_available]
                  properties:
                    short_description: { type: [string, "null"] }
                    contact_handoff_available: { type: boolean, const: true }
            engagement:
              type: object
              required: [favorite, reaction]
              properties:
                favorite: { type: boolean }
                reaction: { type: [string, "null"], enum: [like, dislike, null] }
            similar_listings: { type: array, items: { $ref: "#/components/schemas/PublicListingCard" } }
    PublicSearchResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/PublicListingCard" } }
        meta:
          type: object
          required: [count, next_cursor, applied_filters]
          properties:
            count: { type: integer, minimum: 0 }
            next_cursor: { type: [string, "null"] }
            applied_filters: { type: object, additionalProperties: true }
    EngagementCollectionsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [favorites, likes, dislikes]
          properties:
            favorites: { type: array, items: { $ref: "#/components/schemas/PublicListingCard" } }
            likes: { type: array, items: { $ref: "#/components/schemas/PublicListingCard" } }
            dislikes: { type: array, items: { $ref: "#/components/schemas/PublicListingCard" } }
    FavoriteMutationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [listing_id, favorite]
          properties:
            listing_id: { type: string, format: uuid }
            favorite: { type: boolean }
    ReactionMutationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [listing_id, reaction]
          properties:
            listing_id: { type: string, format: uuid }
            reaction: { type: [string, "null"], enum: [like, dislike, null] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            fields: { type: object, additionalProperties: true }
            request_id: { type: string }
            current_version: { type: integer, minimum: 1 }
            checklist:
              type: array
              items: { $ref: "#/components/schemas/QualityCheck" }
  responses:
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TenantDenied:
      description: Active user is not a member of the selected agency
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found inside the active tenant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ConflictError:
      description: Optimistic concurrency, reference, upload-key, or workflow conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
