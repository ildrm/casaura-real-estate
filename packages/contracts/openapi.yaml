openapi: 3.1.0
info:
  title: Casaura API
  version: 1.10.0-release-candidate
  description: Production-candidate contract for identity, tenancy, listings, marketplace, integrations, grounded AI, billing, privacy, and administration.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
security: []
tags:
  - name: System
  - name: Authentication
  - name: Agencies
  - name: Listings
  - name: Media
  - name: Marketplace
  - name: Engagement
  - name: Collaboration
  - name: Agency Product
  - name: Administration
  - name: Privacy
  - name: Integrations
  - name: Advanced Marketplace
  - name: Grounded AI
  - name: Billing
paths:
  /health/live:
    get:
      tags: [System]
      operationId: liveness
      responses:
        "200": { description: Process is alive, content: { application/json: { schema: { $ref: "#/components/schemas/OperationsHealth" } } } }
  /health/ready:
    get:
      tags: [System]
      operationId: readiness
      responses:
        "200": { description: Required dependencies and process heartbeats are ready, content: { application/json: { schema: { $ref: "#/components/schemas/OperationsHealth" } } } }
        "503": { description: A required dependency or process heartbeat is unavailable }
  /health:
    get:
      tags: [System]
      operationId: health
      responses:
        "200":
          description: API is ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: casaura-api }
                  version: { type: string }
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerConsumer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalResponse"
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/forgot-password:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "200": { description: A non-enumerating recovery response }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/reset-password:
    post:
      tags: [Authentication]
      operationId: resetPassword
      responses:
        "200": { description: Password reset and existing sessions revoked }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/invitations/{token}/accept:
    post:
      tags: [Authentication, Agencies]
      operationId: acceptAgencyInvitation
      parameters:
        - { in: path, name: token, required: true, schema: { type: string } }
      responses:
        "200": { description: Existing user membership activated }
        "201": { description: Invited user account and membership activated }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/mfa/challenge:
    post:
      tags: [Authentication]
      operationId: challengeMfa
      responses:
        "200": { description: MFA challenge accepted and session upgraded }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/register-agency:
    post:
      tags: [Authentication, Agencies]
      operationId: registerAgency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RegisterRequest"
                - type: object
                  required: [agency_name]
                  properties:
                    agency_name: { type: string, minLength: 2, maxLength: 160 }
                    timezone: { type: string, default: UTC }
      responses:
        "201":
          description: Agency and owner account created atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalResponse"
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalResponse"
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/logout:
    post:
      security: [{ sanctum: [] }]
      tags: [Authentication]
      operationId: logout
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /auth/email/verification-notification:
    post:
      security: [{ sanctum: [] }]
      tags: [Authentication]
      operationId: resendEmailVerification
      responses:
        "202": { description: Verification delivery accepted without enumeration }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /auth/email/verify/{id}/{hash}:
    get:
      security: [{ sanctum: [] }]
      tags: [Authentication]
      operationId: verifyEmail
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: hash, required: true, schema: { type: string } }
      responses:
        "200": { description: Signed email address verified }
        "403": { description: Invalid or expired signature }
  /auth/mfa/setup:
    post:
      security: [{ sanctum: [] }]
      tags: [Authentication]
      operationId: setupMfa
      responses:
        "200": { description: Pending TOTP enrollment returned once }
  /auth/mfa/confirm:
    post:
      security: [{ sanctum: [] }]
      tags: [Authentication]
      operationId: confirmMfa
      responses:
        "200": { description: TOTP enrollment confirmed and recovery codes returned once }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/mfa:
    delete:
      security: [{ sanctum: [] }]
      tags: [Authentication]
      operationId: disableMfa
      responses:
        "204": { description: MFA disabled and established sessions revoked }
  /me:
    get:
      security: [{ sanctum: [] }]
      tags: [Authentication]
      operationId: me
      responses:
        "200":
          description: Current principal and memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /agencies/{agency}:
    get:
      tags: [Agencies]
      operationId: publicAgency
      parameters:
        - in: path
          name: agency
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Public safe agency projection
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Agency" }
        "404": { description: Not found }
  /agency:
    get:
      security: [{ sanctum: [] }]
      tags: [Agencies]
      operationId: currentAgency
      parameters:
        - $ref: "#/components/parameters/AgencyId"
      responses:
        "200":
          description: Current tenant workspace projection
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Agency" }
        "403": { $ref: "#/components/responses/TenantDenied" }
    patch:
      security: [{ sanctum: [] }]
      tags: [Agencies]
      operationId: updateCurrentAgency
      parameters:
        - $ref: "#/components/parameters/AgencyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 160 }
                short_description: { type: [string, "null"], maxLength: 320 }
                phone: { type: [string, "null"], maxLength: 40 }
                website: { type: [string, "null"], format: uri }
      responses:
        "200":
          description: Updated
        "403": { $ref: "#/components/responses/TenantDenied" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /agency/members:
    get:
      security: [{ sanctum: [] }]
      tags: [Agencies]
      operationId: agencyMembers
      parameters:
        - $ref: "#/components/parameters/AgencyId"
      responses:
        "200":
          description: Tenant-scoped members
        "403": { $ref: "#/components/responses/TenantDenied" }
  /property-catalog:
    get:
      security: [{ sanctum: [] }]
      tags: [Listings]
      operationId: propertyCatalog
      parameters:
        - $ref: "#/components/parameters/AgencyId"
      responses:
        "200":
          description: Stable active property types, amenities, and typed feature definitions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyCatalogResponse" }
        "403": { $ref: "#/components/responses/TenantDenied" }
  /listings:
    get:
      security: [{ sanctum: [] }]
      tags: [Listings]
      operationId: listListings
      parameters:
        - $ref: "#/components/parameters/AgencyId"
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, changes_requested, in_review, published, withdrawn, needs_attention]
        - in: query
          name: q
          schema: { type: string, maxLength: 120 }
        - in: query
          name: property_type
          schema: { type: string, maxLength: 80 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Cursor-paginated tenant inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingPage" }
        "403": { $ref: "#/components/responses/TenantDenied" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      security: [{ sanctum: [] }]
      tags: [Listings]
      operationId: createListing
      parameters:
        - $ref: "#/components/parameters/AgencyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingCreateRequest" }
      responses:
        "201":
          description: Property/listing draft and initial immutable history created atomically
          headers:
            ETag: { schema: { type: string }, description: Quoted listing version }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingResponse" }
        "403": { $ref: "#/components/responses/TenantDenied" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /listings/{listing}:
    parameters:
      - $ref: "#/components/parameters/ListingId"
    get:
      security: [{ sanctum: [] }]
      tags: [Listings]
      operationId: getListing
      parameters:
        - $ref: "#/components/parameters/AgencyId"
      responses:
        "200":
          description: Tenant-owned listing projection
          headers:
            ETag: { schema: { type: string }, description: Quoted listing version }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      security: [{ sanctum: [] }]
      tags: [Listings]
      operationId: updateListing
      parameters:
        - $ref: "#/components/parameters/AgencyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingUpdateRequest" }
      responses:
        "200":
          description: Optimistic autosave completed and immutable version appended
          headers:
            ETag: { schema: { type: string }, description: Quoted listing version }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      security: [{ sanctum: [] }]
      tags: [Listings]
      operationId: deleteListing
      parameters:
        - $ref: "#/components/parameters/AgencyId"
      responses:
        "204": { description: Eligible draft soft-deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /listings/{listing}/submit:
    post:
      security: [{ sanctum: [] }]
      tags: [Listings]
      operationId: submitListing
      parameters:
        - $ref: "#/components/parameters/AgencyId"
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Complete draft submitted for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /listings/{listing}/publish:
    post:
      security: [{ sanctum: [] }]
      tags: [Listings]
      operationId: publishListing
      parameters:
        - $ref: "#/components/parameters/AgencyId"
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: In-review listing published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /listings/{listing}/request-changes:
    post:
      security: [{ sanctum: [] }]
      tags: [Listings]
      operationId: requestListingChanges
      parameters:
        - $ref: "#/components/parameters/AgencyId"
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        "200":
          description: Listing returned with reviewer note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /listings/{listing}/withdraw:
    post:
      security: [{ sanctum: [] }]
      tags: [Listings]
      operationId: withdrawListing
      parameters:
        - $ref: "#/components/parameters/AgencyId"
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Published listing withdrawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /listings/{listing}/media:
    get:
      security: [{ sanctum: [] }]
      tags: [Media]
      operationId: listListingMedia
      parameters:
        - $ref: "#/components/parameters/AgencyId"
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Safe metadata for active owned media
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Media" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      security: [{ sanctum: [] }]
      tags: [Media]
      operationId: uploadListingMedia
      parameters:
        - $ref: "#/components/parameters/AgencyId"
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                alt_text: { type: [string, "null"], maxLength: 300 }
      responses:
        "200":
          description: Completed idempotent upload replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaResponse" }
        "201":
          description: Private original and WebP derivatives created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /listings/{listing}/media/order:
    patch:
      security: [{ sanctum: [] }]
      tags: [Media]
      operationId: reorderListingMedia
      parameters:
        - $ref: "#/components/parameters/AgencyId"
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_ids]
              properties:
                media_ids:
                  type: array
                  minItems: 1
                  maxItems: 30
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Complete owned-media order persisted
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /listings/{listing}/media/{media}:
    delete:
      security: [{ sanctum: [] }]
      tags: [Media]
      operationId: deleteListingMedia
      parameters:
        - $ref: "#/components/parameters/AgencyId"
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/MediaId"
      responses:
        "204": { description: Media soft-deleted and private objects quarantined }
        "404": { $ref: "#/components/responses/NotFound" }
  /public/search:
    get:
      tags: [Marketplace]
      operationId: publicSearch
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 160 } }
        - { in: query, name: intent, schema: { type: string, enum: [sale, rent] } }
        - { in: query, name: min_price, schema: { type: integer, minimum: 0 } }
        - { in: query, name: max_price, schema: { type: integer, minimum: 0 } }
        - { in: query, name: currency, schema: { type: string, minLength: 3, maxLength: 3 } }
        - { in: query, name: property_type, schema: { type: string, maxLength: 80 } }
        - { in: query, name: min_bedrooms, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { in: query, name: min_bathrooms, schema: { type: number, minimum: 0, maximum: 100 } }
        - { in: query, name: min_area_sqm, schema: { type: number, minimum: 0 } }
        - { in: query, name: max_area_sqm, schema: { type: number, minimum: 0 } }
        - in: query
          name: amenities
          description: Comma-separated stable amenity slugs.
          schema: { type: string, maxLength: 500 }
        - { in: query, name: verified_agency, schema: { type: boolean } }
        - in: query
          name: bounds
          description: Comma-separated min longitude, min latitude, max longitude, max latitude.
          schema: { type: string, maxLength: 160 }
        - in: query
          name: radius
          description: Comma-separated latitude, longitude, and radius in kilometres.
          schema: { type: string, maxLength: 160 }
        - { in: query, name: sort, schema: { type: string, enum: [newest, price_asc, price_desc], default: newest } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 2000 } }
      responses:
        "200":
          description: Public-safe, cursor-paginated published listing cards.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSearchResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /public/discovery:
    get:
      tags: [Marketplace]
      operationId: publicDiscovery
      responses:
        "200":
          description: Stable public listing and storefront identifiers used for sitemap discovery.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [listings, agencies]
                    properties:
                      listings: { type: array, items: { type: object, additionalProperties: true } }
                      agencies: { type: array, items: { type: object, additionalProperties: true } }
  /public/listings/{listing}:
    get:
      tags: [Marketplace]
      operationId: publicListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Published public listing detail using only allowlisted projection fields.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PublicListingDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /public/media/{media}/{kind}:
    get:
      tags: [Marketplace, Media]
      operationId: publicListingMedia
      parameters:
        - $ref: "#/components/parameters/MediaId"
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [thumbnail, display] }
      responses:
        "200":
          description: WebP derivative belonging to an active published listing.
          content:
            image/webp:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
  /account/engagements:
    get:
      security: [{ sanctum: [] }]
      tags: [Engagement]
      operationId: accountEngagements
      responses:
        "200":
          description: Current user's private favorite and reaction collections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngagementCollectionsResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /account/privacy/requests:
    get:
      security: [{ sanctum: [] }]
      tags: [Privacy]
      operationId: listPrivacyRequests
      responses:
        "200": { description: Current user's recent export and deletion requests }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      security: [{ sanctum: [] }]
      tags: [Privacy]
      operationId: createPrivacyRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties: { type: { type: string, enum: [export, deletion] } }
      responses:
        "202": { description: Export processing or reviewed deletion request accepted }
        "422": { $ref: "#/components/responses/ValidationError" }
  /account/privacy/requests/{privacyRequest}/download:
    get:
      security: [{ sanctum: [] }]
      tags: [Privacy]
      operationId: downloadPrivacyExport
      parameters:
        - { in: path, name: privacyRequest, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Decrypted JSON export for its authenticated subject, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "410": { description: Export expired }
  /account/favorites/{listing}:
    parameters:
      - $ref: "#/components/parameters/ListingId"
    put:
      security: [{ sanctum: [] }]
      tags: [Engagement]
      operationId: favoriteListing
      responses:
        "200":
          description: Published listing is favorited idempotently.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteMutationResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      security: [{ sanctum: [] }]
      tags: [Engagement]
      operationId: unfavoriteListing
      responses:
        "200":
          description: Favorite is absent after an idempotent delete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteMutationResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /account/reactions/{listing}:
    parameters:
      - $ref: "#/components/parameters/ListingId"
    put:
      security: [{ sanctum: [] }]
      tags: [Engagement]
      operationId: reactToListing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reaction]
              properties:
                reaction: { type: string, enum: [like, dislike] }
      responses:
        "200":
          description: Private reaction is set or replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReactionMutationResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
